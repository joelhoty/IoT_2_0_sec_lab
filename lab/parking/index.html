<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>案例一模擬：繳費機上的貼紙</title><link rel="stylesheet" href="../lab.css"></head><body>
<main>
<div class="card fake">
  <div class="org">示範市 停車費線上繳納（虛構單位）</div>
  <h1>您的停車費尚未繳納</h1>
  <p>請於今日內完成繳費，以免產生滯納金。</p>
  <form id="f" autocomplete="off">
    <label>車牌號碼</label><input type="text" placeholder="例如 ABC-0000（請勿輸入真實資料）">
    <label>信用卡號</label><input type="text" inputmode="numeric" placeholder="教學模擬，請勿輸入真實卡號">
    <button type="submit">立即繳費</button>
    <button type="button" class="ghost" id="doubt">我覺得這頁可疑</button>
  </form>
</div>
<section id="r" class="reveal card">
  <span class="tag social">社交工程</span>
  <h2 id="rt"></h2>
  <div id="rs"></div>
  <p>你現在的網址主機名稱是 <code id="host"></code>，主要網域是 <code id="md"></code>。真正的停車繳費會在政府網域（例如以 <code>gov.tw</code> 結尾）或官方 App。</p>
  <h2>怎麼防</h2>
  <p><b>你</b>：掃描前摸摸看有沒有貼紙；開啟後先看主要網域；繳費改用官方 App 或自己輸入的網址。<br>
     <b>管理單位</b>：定期巡檢繳費機，並在 QR Code 旁印出官方網址。</p>
  <p class="hint">對照講義 §1.3 案例一；簡報基礎篇「案例一」。</p>
</section>
<a class="back" href="../index.html">← 回掃碼體驗室</a>
</main>
<script src="../lab.js"></script><script>
LAB.banner('..');
document.getElementById('host').textContent = location.hostname;
document.getElementById('md').textContent = LAB.mainDomain(location.hostname) || '（在本機開啟，沒有網域）';
const finish = submitted => {
  document.getElementById('rt').textContent = submitted ? '在真實事件中，付款資料剛才已經交給對方' : '你在輸入前停下來了，這正是關鍵的一步';
  LAB.steps(document.getElementById('rs'), [
    {text: '掃描貼在繳費機上的 QR Code', note: 'QR Code 只是一段網址，看不出是誰貼的', state: 'done'},
    {text: '開啟仿冒的繳費頁', note: '只是開啟頁面，還沒有交出資料', state: 'done'},
    submitted ? {text: '輸入卡號並按下繳費', note: '損害在這一步成立：卡號、有效期限與驗證碼交給對方', state: 'harm'}
              : {text: '沒有輸入，改走官方管道', note: '付款資料沒有外洩', state: 'stop'}]);
  LAB.show('r');
};
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); LAB.wipe(e.target); finish(true); });
document.getElementById('doubt').addEventListener('click', () => finish(false));
</script></body></html>
