<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>對照二模擬：看不懂不等於保密</title><link rel="stylesheet" href="../lab.css"></head><body>
<main>
<div class="card fake"><div class="org">資訊社活動報到（虛構）</div><h1>報到成功！</h1>
<p>你的報到代碼：<code id="id"></code></p><p class="hint">這串字看起來像亂碼，對吧？</p>
<button id="dec">用公開規則還原它</button></div>
<section id="r" class="reveal card"><span class="tag contrast">對照：不是攻擊，是設計問題</span>
<p>這是 <b>Base64</b>：依公開規則轉換，任何人都能還原。還原後是：</p>
<div class="out mono" id="plain"></div>
<p>報到網址把學號直接編進去，拿到這張 QR Code（或它的照片）的人都看得到學號。</p>
<p><b>發行單位</b>：需要識別參加者時，用伺服器產生、無法反推的隨機編號；真正要保密的資料不放進公開的 QR Code。</p>
<p class="hint">對照講義 §1.3.2 對照二、§2.10.1；實作篇 B2。</p></section>
<a class="back" href="../index.html">← 回掃碼體驗室</a></main>
<script src="../lab.js"></script><script>
LAB.banner('..');
const id = LAB.param('id', 'QjExMjAzNDU2').slice(0, 80);
document.getElementById('id').textContent = id;
document.getElementById('dec').onclick = () => {
  let plain; try { plain = new TextDecoder().decode(Uint8Array.from(atob(id), c => c.charCodeAt(0))); } catch { plain = '（這串不是有效的 Base64）'; }
  document.getElementById('plain').textContent = plain + '　← 虛構學號'; LAB.show('r');
};
</script></body></html>
